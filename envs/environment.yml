#  If you don't have conda, install Miniconda first [make sure to choose Python 3.11, and
#       install into folder with much free storage]:
#    https://docs.conda.io/en/latest/miniconda.html
#
#  Then create the project environment:
#    conda env create -f envs/environment.yml
#    conda activate fumaraseevo

name: fumaraseevo
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.11.13
  - pip=25.2

  # ---------------------------------------------------------------
  # Bioinformatics tools
  # ---------------------------------------------------------------
  - mmseqs2=18.8cc5c           # homology search
  - mafft                      # multiple sequence alignment
  - iqtree=2.4.1               # phylogenetic inference (ModelFinder + ultrafast bootstrap)

  # ---------------------------------------------------------------
  # R + phylogeny plotting
  # ---------------------------------------------------------------
  - r-base=4.5.1
  - r-essentials               # base R packages
  - bioconductor-ggtree        # tree visualization
  - bioconductor-treeio        # tree I/O (reads .iqtree, .nwk, .nexus)
  - r-ape                      # phylogenetic tools, unrooted trees
  - r-ggplot2
  - r-dplyr=1.2.0
  - r-tidyr=1.3.2
  - r-svglite                  # SVG export for figures

  # ---------------------------------------------------------------
  # Python packages (Conda)
  # ---------------------------------------------------------------
  - numpy=2.3.5
  - scipy=1.16.3
  - statsmodels=0.14.5         # Kruskal-Wallis, Wilcoxon, BH correction
  - seaborn=0.13.2

  # ---------------------------------------------------------------
  # Python packages (Pip)
  # ---------------------------------------------------------------
  - pip:
    # Data / HTTP
    - pandas==2.2.2
    - requests==2.32.3

    # Bioinformatics
    - biopython==1.85          # FASTA I/O, sequence utilities

    # Embeddings (ESM)
    - fair-esm==2.0.0          # ESM-1b / 2 protein language model
    - torchvision              # torch ecosystem
    
    # Dimensionality reduction
    - scikit-learn==1.8.0      # t-SNE
    - umap-learn==0.5.11       # UMAP

    # Figures
    - matplotlib==3.10.5
    
    # ProstT5 / LLM Tooling
    - sentencepiece==0.2.1     # ProstT5 tokenizer
    - transformers==5.3.0      # ProstT5 / ESM model loading
    
    # PyTorch with CUDA 12.4
    - --extra-index-url https://download.pytorch.org/whl/cu124
    - torch==2.6.0+cu124