#  If you don't have conda, install Miniconda first [make sure to choose Python 3.11, and
#       install into folder with much free storage]:
#    https://docs.conda.io/en/latest/miniconda.html
#
#  Then create the project environment:
#    conda env create -f envs/environment.yml
#    conda activate fumaraseevo

name: fumaraseevo
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.11
  - pip

  # ---------------------------------------------------------------
  # Bioinformatics tools
  # ---------------------------------------------------------------
  - mmseqs2                # homology search
  - mafft                  # multiple sequence alignment
  - iqtree=2               # phylogenetic inference (ModelFinder + ultrafast bootstrap)

  # ---------------------------------------------------------------
  # R + phylogeny plotting
  # ---------------------------------------------------------------
  - r-base=4.3
  - r-essentials           # base R packages
  - bioconductor-ggtree    # tree visualization
  - bioconductor-treeio    # tree I/O (reads .iqtree, .nwk, .nexus)
  - r-ape                  # phylogenetic tools, unrooted trees
  - r-ggplot2
  - r-dplyr
  - r-tidyr
  - r-svglite              # SVG export for figures

  # ---------------------------------------------------------------
  # Python packages
  # ---------------------------------------------------------------
  - pip:
    # Data / stats
    - numpy
    - pandas
    - scipy
    - statsmodels            # Kruskal-Wallis, Wilcoxon, BH correction

    # HTTP / data fetching
    - requests

    # Bioinformatics
    - biopython              # FASTA I/O, sequence utilities

    # Embeddings
    - esm               # ESM-1b / 2 protein language model
    - torch                  # ESM dependency
    - torchvision            # torch ecosystem

    # Dimensionality reduction
    - scikit-learn           # t-SNE (perplexity=30, n_iter=1000)
    - umap-learn             # UMAP (n_neighbors=15, min_dist=0.1)

    # Figures
    - matplotlib
    - seaborn
    
    # ProstT5
    - sentencepiece          # ProstT5 tokenizer
    - transformers>=4.40     # ProstT5 / ESM model loading
    # NOTE: torch must be installed manually after env creation for CUDA support:
    #- torch>=2.6 --index-url https://download.pytorch.org/whl/cu124  # ProstT5 requires >=2.6 (CVE-2025-32434)